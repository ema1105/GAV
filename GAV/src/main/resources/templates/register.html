<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/x-icon" th:href="@{/img/logo_gav.ico}">
  <link rel="icon" type="image/png" th:href="@{/img/logo_gav.png}">

  <meta charset="UTF-8">
  <title>Registro de Cliente - Manzanillo del Mar</title>
  <link rel="stylesheet" th:href="@{/css/register.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="register-container">
  <!-- Panel izquierdo con imagen -->
  <div class="register-image">
    <div class="image-overlay">
      <h1>Únete a Nosotros</h1>
      <p>Crea tu cuenta y comienza a viajar</p>
    </div>
    <img th:src="@{/img/ctg.jpg}" alt="Registro" class="background-image"/>
  </div>

  <!-- Panel derecho con formulario -->
  <div class="register-form">
    <div class="form-container">
      <div class="form-header">
        <div class="logo-container">
         <!-- <img th:src="@{/img/gav.jpg}" alt="Logo" class="logo"/> -->
        </div>
        <h2>Registro de Cliente</h2>
        <p>Completa tus datos para crear tu cuenta</p>
      </div>

      <form action="/register" method="POST" class="form">
        <div class="form-grid">
          <div class="form-group">
            <div class="input-container">
              <input type="text" id="fullname" name="fullname" required />
              <label for="fullname" class="label">
                <span class="icon"><i class="fa-solid fa-user"></i></span>
                Nombre Completo
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="text" id="lastname" name="lastname" required />
              <label for="lastname" class="label">
                <span class="icon"><i class="fa-solid fa-id-badge"></i></span>
                Apellidos Completos
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="text" id="username" name="username" required />
              <label for="username" class="label">
                <span class="icon"><i class="fa-solid fa-user-tag"></i></span>
                Nombre de Usuario
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="password" id="password" name="password" required />
              <label for="password" class="label">
                <span class="icon"><i class="fa-solid fa-lock"></i></span>
                Contraseña
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="email" id="email" name="email" required />
              <label for="email" class="label">
                <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                Correo Electrónico
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="text" id="documentNumber" name="documentNumber" required />
              <label for="documentNumber" class="label">
                <span class="icon"><i class="fa-solid fa-id-card"></i></span>

                Documento
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container select-container">
              <select id="documentType" name="documentType" required>
                <option value=""></option>
                <option value="CEDULA">Cédula</option>
                <option value="PASAPORTE">Pasaporte</option>
                <option value="CEDULA_EXTRANJERIA">Cédula de Extranjería</option>
              </select>
              <label for="documentType" class="label">
                <span class="icon"><i class="fa-solid fa-file-lines"></i></span>
                Tipo de Documento
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="text" id="number" name="number" required />
              <label for="number" class="label">
                <span class="icon"><i class="fa-solid fa-phone"></i></span>
                Teléfono


                
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container select-container">
              <select id="sex" name="sex" required>
                <option value=""></option>
                <option value="MALE">Masculino</option>
                <option value="FEMALE">Femenino</option>
              </select>
              <label for="sex" class="label">
                <span class="icon"><i class="fa-solid fa-venus-mars"></i></span>
                Sexo
              </label>
              <div class="underline"></div>
            </div>
          </div>

          <div class="form-group">
            <div class="input-container">
              <input type="number" id="age" name="age" required />
              <label for="age" class="label">
                <span class="icon"><i class="fa-solid fa-calendar-day"></i></span>
                Edad
              </label>
              <div class="underline"></div>
            </div>
          </div>
        </div>

        <button type="submit" class="register-btn">
          <span class="btn-text">Crear Cuenta</span>
          <span class="btn-icon">→</span>
        </button>
      </form>

      <div class="login-link">
        <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
