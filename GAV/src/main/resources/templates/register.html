<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro de Cliente</title>
  <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="container">
  <!-- Imagen decorativa -->
  <div class="image-container">
    <!-- Aquí puedes poner tu imagen -->
    <img src="/img/gav.png" alt="Registro" style="max-width: 24%;">
  </div>

  <h2>Registro de Cliente</h2>

  <form action="/register" method="POST">
    <div class="form-group">
      <label for="fullname">Nombre Completo</label>
      <input type="text" id="fullname" name="fullname" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="lastname">Apellidos Completos</label>
      <input type="text" id="lastname" name="lastname" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="username">Nombre de Usuario</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="documentNumber">Número de Documento</label>
      <input type="text" id="documentNumber" name="documentNumber" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="documentType">Tipo de Documento</label>
      <select id="documentType" name="documentType" class="form-control" required>
        <option value="CEDULA">Cédula</option>
        <option value="PASAPORTE">Pasaporte</option>
        <option value="CEDULA_EXTRANJERIA">Cédula de Extranjería</option>
      </select>
    </div>

    <div class="form-group">
      <label for="number">Teléfono</label>
      <input type="text" id="number" name="number" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="sex">Sexo</label>
      <select id="sex" name="sex" class="form-control" required>
        <option value="MALE">Masculino</option>
        <option value="FEMALE">Femenino</option>
      </select>
    </div>

    <div class="form-group">
      <label for="age">Edad</label>
      <input type="number" id="age" name="age" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Registrarse</button>
  </form>



  <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
</div>

</body>
</html>
