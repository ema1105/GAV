spring.application.name=GAV
#CONEXION CO|N MONGODB
spring.data.mongodb.database=gav
spring.data.mongodb.uri=${MONGODB_URI}

#CONEXION CON REDIS
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=5000
spring.redis.lettuce.pool.enabled=true
spring.redis.lettuce.pool.max-active=8
spring.session.store-type=redis|
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
spring.session.redis.serializer-type=json

#CONSUMO DE API DE MAPAS (MAPBOX)
mapbox.api.token=${MAPBOX_TOKEN}
mapbox.geocoding.url=https://api.mapbox.com/geocoding/v5/mapbox.places
mapbox.directions.url=https://api.mapbox.com/directions/v5/mapbox/driving
